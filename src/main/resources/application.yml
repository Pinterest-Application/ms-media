logging:
  level:
    org.springframework: DEBUG

spring:
  application:
    name: ms-media
  config:
    import: "classpath:application-vault.yml,vault://"
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${db-url}
    username: ${db-username}
    password: ${db-password}
  liquibase:
    enabled: true
    change-log: classpath:migration/changelog-master.xml
    default-schema: ms_media
    liquibase-schema: ms_media
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_schema: ms_media
        ddl-auto: none
    generate-ddl: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${issuer-uri}
  kafka:
    bootstrap-servers: coolify.tail1270a7.ts.net:9094
    consumer:
      group-id: ms-media-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer

server:
  port: 0

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
  client:
    service-url:
      defaultZone: ${eureka-server}

management:
  endpoints:
    web:
      exposure:
        include: health,info


seaweedfs:
  endpoint: ${seaweedfs-endpoint}
  access-key: ${seaweedfs-access-key}
  secret-key: ${seaweedfs-secret-key}